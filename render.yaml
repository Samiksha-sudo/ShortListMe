# Render blueprint. Secrets (sync: false) are entered in the Render dashboard, never committed.
services:
  - type: web
    name: shortlistme-api
    runtime: docker
    rootDir: backend
    plan: starter            # paid: the free plan sleeps and kills background jobs
    numInstances: 1          # rate limiter and tailoring jobs live in memory, so keep this at 1
    healthCheckPath: /health
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - { key: PORT, value: "8000" }
      - { key: DATABASE_URL, value: "sqlite:////data/shortlistme.db" }
      - { key: STORAGE_DIR, value: /data/storage }
      - { key: LLM_PROVIDER, value: gemini }
      - { key: GEMINI_MODEL, value: gemini-2.0-flash }
      - { key: MAIL_BACKEND, value: smtp }
      - { key: SMTP_PORT, value: "587" }
      - { key: ADMIN_EMAILS, value: kadsamiksha347@gmail.com }
      - { key: JWT_SECRET, generateValue: true }
      - { key: CORS_ORIGINS, sync: false }       # https://YOURDOMAIN
      - { key: FRONTEND_URL, sync: false }       # https://YOURDOMAIN
      - { key: GEMINI_API_KEY, sync: false }
      - { key: SMTP_HOST, sync: false }
      - { key: SMTP_USER, sync: false }
      - { key: SMTP_PASSWORD, sync: false }
      - { key: MAIL_FROM, sync: false }          # ShortlistMe <no-reply@YOURDOMAIN>
      - { key: STRIPE_SECRET_KEY, sync: false }  # new restricted or rolled live key
      - { key: STRIPE_PRICE_ID, value: price_1UOPMcCNcho8tq0RDSXml8sF }
      - { key: STRIPE_WEBHOOK_SECRET, sync: false }
